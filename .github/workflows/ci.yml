name: CI
on:
  push:
    branches: [main, feature/initial-setup]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        # Keep the running npm intact while installing its replacement.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pinned-npm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/pinned-npm/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pages:check
