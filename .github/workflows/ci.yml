name: CI
on:
  push:
    branches: [main, feature/initial-setup, feature/mempool-data-integration]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify toolchain
        # Use the npm bundled with the Node release pinned in .nvmrc.
        run: |
          node --version
          npm --version
          test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pages:check
