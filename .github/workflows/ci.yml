name: CI
on:
  push:
    branches: [main, feature/initial-setup, feature/mempool-data-integration]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify toolchain
        # Use the npm bundled with the Node release pinned in .nvmrc.
        run: |
          node --version
          npm --version
          test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pages:check
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test local Pages production build
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
